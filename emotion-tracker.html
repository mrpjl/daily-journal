<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Journal</title>
    <link rel="stylesheet" href="emotion-tracker.css">
</head>
<body>
    <div class="container">
        <h1>Daily Journal</h1>
        
        <div class="input-section">
            <h2>Add Today's Entry</h2>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="emotion">Emotion Score (-5 to 5):</label>
                <input type="number" id="emotion" min="-5" max="5" step="1" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes:</label>
                <textarea id="notes" rows="3" placeholder="Add your notes here..."></textarea>
            </div>
            <div class="form-group">
                <label for="tags">Tags (comma-separated):</label>
                <!-- <input type="text" id="tags" placeholder="e.g., #work, #personal, #health, #finance"> -->
                <select name="tags" id="tags">
                    <option value="#work">WORK</option>
                    <option value="#personal" selected>PERSONAL</option>
                    <option value="#health">HEALTH</option>
                    <option value="#finance">FINANCE</option>
                </select>
            </div>
            <button onclick="addEntry()">Add Entry</button>
        </div>

        <div class="legend">
            <span>Angry/Sad</span>
            <div class="legend-colors">
                <div class="legend-color" style="background: #b71c1c;"></div>
                <div class="legend-color" style="background: #ff7043;"></div>
                <div class="legend-color" style="background: #ebedf0;"></div>
                <div class="legend-color" style="background: #81c784;"></div>
                <div class="legend-color" style="background: #1b5e20;"></div>
            </div>
            <span>Happy</span>
        </div>

        <div class="heat-map-container">
            <div class="heat-map-wrapper"></div>
        </div>

        <div class="notes-section">
            <h2>Notes for Selected Date</h2>
            <p id="selectedDate">No date selected</p>
            <p id="selectedNotes">Click on a date in the heatmap to view notes.</p>
        </div>
    </div>

    <script src="emotion-tracker.js"></script>
</body>
</html>
