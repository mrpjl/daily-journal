<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Journal</title>
    <link rel="stylesheet" href="emotion-tracker-dark.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="top-right-nav">
                <a href="bookmarks.html" class="bookmarks-link">View Bookmarks</a>
            </nav>
        </header>
        <h1>Daily Journal</h1>
        
        <div class="input-section">
            <h2>Add Today's Entry</h2>
            <div class="form-group">
                <label for="date">Date:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="emotion">Emotion Score (-5 to 5):</label>
                <input type="number" id="emotion" min="-5" max="5" step="1" required>
            </div>
            <div class="form-group">
                <label for="notes">Notes:</label>
                <textarea id="notes" rows="3" placeholder="Add your notes here..." maxlength="1000"></textarea>
                <div class="char-count"><span id="notesCounter"></span></div>
            </div>
            <div class="form-group">
                <fieldset>
                    <legend>Tags:</legend>
                    <div id="tagsCheckboxes">
                        <label><input type="checkbox" value="work" name="tags"> Work</label>
                        <label><input type="checkbox" value="personal" name="tags"> Personal</label>
                        <label><input type="checkbox" value="health" name="tags"> Health</label>
                        <label><input type="checkbox" value="finance" name="tags"> Finance</label>
                        <label><input type="checkbox" value="family" name="tags"> Family</label>
                        <label><input type="checkbox" value="friends" name="tags"> Friends</label>
                        <label><input type="checkbox" value="bookmark" name="tags"> Bookmark</label>
                        <label><input type="checkbox" value="other" name="tags"> Other</label>
                    </div>
                </fieldset>
            </div>
            <button id="addEntryButton">Add Entry</button>
        </div>

        <div class="legend">
            <span>Sad</span>
            <div class="legend-colors">
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
                <div class="legend-color"></div>
            </div>
            <span>Happy</span>
        </div>

        <div class="heat-map-container">
            <div class="heat-map-wrapper"></div>
        </div>

        <div class="notes-section">
            <h2>Notes for Selected Date</h2>
            <p id="selectedDate">No date selected</p>
            <p id="selectedNotes">Click on a date in the heatmap to view notes.</p>
            <div id="notesActions"></div> <!-- Placeholder for dynamic buttons -->
        </div>

        <div class="search-section">
            <h2>Search Notes</h2>
            <input type="text" id="searchInput" placeholder="Search notes..." />
            <button id="searchButton">Search</button>
            <button id="refreshButton">Refresh</button>
            <div id="searchResults"></div>
        </div>
    </div>

    <script src="emotion-tracker.js"></script>
</body>
</html>
